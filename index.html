<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Download Appie</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0b0b0f;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      color: white;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .description {
      color: #aaa;
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      padding: 17px 20px;

      border-radius: 16px;
      background: white;
      color: #111;

      text-decoration: none;
      font-size: 17px;
      font-weight: 700;

      box-shadow: 0 10px 30px rgba(255,255,255,0.12);

      transition: 0.25s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(255,255,255,0.2);
    }

    .download-btn:active {
      transform: scale(0.97);
    }

    .download-icon {
      font-size: 21px;
    }

    .info {
      margin-top: 18px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Agar logo hai to logo.png ko apne logo ke naam se change karo -->
    <img src="logo.png" class="logo" alt="Appie">

    <h1>Appie</h1>

    <p class="description">
      Connect with new people, start conversations<br>
      and discover something new.
    </p>

    <!-- APK DOWNLOAD BUTTON -->
    <a href="./appie.apk" class="download-btn" download>
      <span class="download-icon">↓</span>
      Download Appie
    </a>

    <div class="info">
      Android APK • Latest Version
    </div>

  </div>

</body>
</html>
